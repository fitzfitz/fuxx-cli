<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Metallic Bevel Gradient for Border -->
    <linearGradient id="cyber-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFCC"/>
      <stop offset="20%" stop-color="#00FF66"/>
      <stop offset="45%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="90%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Deep Radial Illumination -->
    <radialGradient id="cyber-body" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>

    <!-- Top-Left Specular Reflection Sheen -->
    <linearGradient id="cyber-specular" x1="0%" y1="0%" x2="60%" y2="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#00FF88" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner Bevel Lighting -->
    <linearGradient id="inner-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#00FF66" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Badge Drop Shadow -->
    <filter id="cyber-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00FF66" flood-opacity="0.2"/>
    </filter>

    <!-- Multi-Layer Neon Glow Filter -->
    <filter id="neon-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="glow1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="glow2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" result="glow3"/>
      <feMerge>
        <feMergeNode in="glow3"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern Texture -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00FF66" stroke-width="1" stroke-opacity="0.06"/>
    </pattern>

    <clipPath id="cyber-badge-clip">
      <rect x="82" y="82" width="860" height="860" rx="210" ry="210"/>
    </clipPath>
  </defs>

  <!-- Badge Body with Shadow & Metallic Rim -->
  <rect x="82" y="82" width="860" height="860" rx="210" ry="210"
        fill="url(#cyber-body)"
        stroke="url(#cyber-rim)" stroke-width="16"
        filter="url(#cyber-shadow)"/>

  <!-- Cyber Grid Texture inside Badge -->
  <rect x="82" y="82" width="860" height="860" rx="210" ry="210"
        fill="url(#cyber-grid)" clip-path="url(#cyber-badge-clip)"/>

  <!-- Inner Bevel Rim -->
  <rect x="92" y="92" width="840" height="840" rx="200" ry="200"
        fill="none" stroke="url(#inner-bevel)" stroke-width="4"/>

  <!-- Specular Reflection Sheen -->
  <path d="M 82 82 L 942 82 L 942 320 Q 512 560 82 440 Z"
        fill="url(#cyber-specular)" clip-path="url(#cyber-badge-clip)"/>

  <!-- Mascot Glyph: Layered Glowing ╭ ∩ ╮ -->
  <!-- Layer 1: Ambient Neon Bloom -->
  <g fill="none" stroke="#00FF66" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-bloom)">
    <path d="M 350 468 L 297 468 A 60 60 0 0 0 237 528 L 237 670" stroke-width="50" opacity="0.9"/>
    <path d="M 437 670 L 437 428 A 75 75 0 0 1 587 428 L 587 670" stroke-width="50" opacity="0.9"/>
    <path d="M 674 468 L 727 468 A 60 60 0 0 1 787 528 L 787 670" stroke-width="50" opacity="0.9"/>
  </g>

  <!-- Layer 2: Ultra-Bright White-Green Core -->
  <g fill="none" stroke="#EAFFFA" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 350 468 L 297 468 A 60 60 0 0 0 237 528 L 237 670" stroke-width="18" opacity="0.95"/>
    <path d="M 437 670 L 437 428 A 75 75 0 0 1 587 428 L 587 670" stroke-width="18" opacity="0.95"/>
    <path d="M 674 468 L 727 468 A 60 60 0 0 1 787 528 L 787 670" stroke-width="18" opacity="0.95"/>
  </g>
</svg>
