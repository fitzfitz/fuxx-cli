<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- CRT Monitor Chassis Gradient -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282E36"/>
      <stop offset="100%" stop-color="#14171A"/>
    </linearGradient>

    <!-- Deep Phosphor Screen Glow -->
    <radialGradient id="crt-screen" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0C2D13"/>
      <stop offset="60%" stop-color="#051508"/>
      <stop offset="100%" stop-color="#020803"/>
    </radialGradient>

    <!-- CRT Horizontal Scanlines Pattern -->
    <pattern id="scanlines" width="1024" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1024" height="2.5" fill="#000000" fill-opacity="0.4"/>
    </pattern>

    <!-- Phosphor Bloom Glow Filter -->
    <filter id="phosphor-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- CRT Monitor Chassis -->
  <rect x="82" y="82" width="860" height="860" rx="160" ry="160"
        fill="url(#chassis-grad)" stroke="#3D4652" stroke-width="6"/>

  <!-- Screen Bezel Inset -->
  <rect x="132" y="122" width="760" height="720" rx="90" ry="90"
        fill="#0A0D10" stroke="#192026" stroke-width="8"/>

  <!-- Curved Phosphor Screen -->
  <rect x="152" y="142" width="720" height="680" rx="70" ry="70"
        fill="url(#crt-screen)"/>

  <!-- Scanlines Overlay -->
  <rect x="152" y="142" width="720" height="680" rx="70" ry="70"
        fill="url(#scanlines)"/>

  <!-- CRT Curved Glass Reflection -->
  <path d="M 180 180 Q 512 210 844 180 C 840 260 800 240 512 240 C 224 240 184 260 180 180 Z"
        fill="#FFFFFF" fill-opacity="0.04"/>

