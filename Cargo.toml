[package]
name = "fuxx"
version = "0.2.0"
edition = "2024"

[dependencies]
# GPUI (Zed's GPU UI framework) is pre-1.0 with no crates.io release: a git dependency pinned
# to one Zed commit. Bump the rev deliberately (see docs/03-Tech-Stack/30 - Tech Stack.md).
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d2a4b3f7f194184dccadfa7a091d16a06482752" }
# font-kit: without it GPUI renders no text on macOS.
# runtime_shaders: compile Metal shaders at startup instead of build time, so full Xcode is not needed.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d2a4b3f7f194184dccadfa7a091d16a06482752", features = ["font-kit", "runtime_shaders"] }
# Terminal core: screen grid + VT/escape parser (the engine behind Alacritty and Zed's terminal).
alacritty_terminal = "0.26.0"
# Pseudo-terminal: spawns the shell and pipes bytes (reused from v1).
portable-pty = "0.9.0"
# Channel from the PTY reader thread to the UI (decision D3). Already in Cargo.lock via GPUI.
futures = "0.3"
# Derive Serialize/Deserialize for the restore file. Already in Cargo.lock via GPUI.
serde = { version = "1.0.228", features = ["derive"] }
# JSON for the restore file. Already in Cargo.lock via GPUI.
serde_json = "1.0.150"
# The agent browser (M10c): a WKWebView in its own NSWindow, driven through objc2. Default
# features off: they pull in every WebKit class plus crates fuxx doesn't otherwise have.
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKError", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKSnapshotConfiguration", "WKUIDelegate", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWindowFeatures"] }
# The objc2 runtime, AppKit, Foundation and blocks under it, at the versions GPUI already locks.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSAccessibility", "NSActionCell", "NSAppearance", "NSApplication", "NSAttributedString", "NSBitmapImageRep", "NSBox", "NSCell", "NSColor", "NSControl", "NSEvent", "NSFont", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSImageView", "NSLayoutAnchor", "NSLayoutConstraint", "NSResponder", "NSRunningApplication", "NSStringDrawing", "NSText", "NSTextField", "NSTextFieldCell", "NSTextView", "NSToolbar", "NSToolbarItem", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSDate", "NSDictionary", "NSError", "NSGeometry", "NSNotification", "NSOperation", "NSString", "NSURL", "NSURLError", "NSURLRequest", "NSUserDefaults"] }
block2 = "0.6.2"

[features]
# Off-screen screenshots of UI scenes (M11): `cargo run --features ui-shots -- __ui-shots [filter]`.
# Pulls GPUI's test support, so it is never part of a normal build.
ui-shots = ["gpui/test-support", "gpui_platform/test-support"]
