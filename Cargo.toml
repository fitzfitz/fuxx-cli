[package]
name = "fuxx"
version = "0.1.0"
edition = "2024"

[dependencies]
# GPUI (Zed's GPU UI framework) is pre-1.0 with no crates.io release: a git dependency pinned
# to one Zed commit. Bump the rev deliberately (see docs/03-Tech-Stack/30 - Tech Stack.md).
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d2a4b3f7f194184dccadfa7a091d16a06482752" }
# font-kit: without it GPUI renders no text on macOS.
# runtime_shaders: compile Metal shaders at startup instead of build time, so full Xcode is not needed.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d2a4b3f7f194184dccadfa7a091d16a06482752", features = ["font-kit", "runtime_shaders"] }
